[project]
name = "fixora-ai"
version = "0.1.0"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.13"

[serve]
port = 8000

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "neutral"
font = "inter"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[dependencies]

[dependencies.npm]
"@hugeicons/react" = "*"
"@hugeicons/core-free-icons" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/inter" = "^5.2.0"
"@fontsource-variable/outfit" = "^5.2.0"
"lucide-react" = "^0.468.0"
"idb-keyval" = "^6.2.1"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
framer-motion = "14.3.0"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "Fixora — care for your laptop"
description = "Fixora customer chat and repair-shop workspace. Interactive demonstration."
theme_color = "#f8f8fa"

[dependencies.npm.dev]
fake-indexeddb = "6.2.6"
